[project]
name = "topo-agent-mcp"
version = "0.1.0"
description = "Shared experiments and leaderboard for topo-agent"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["mcp>=2,<3", "pillow>=10"]

[project.scripts]
topo-mcp = "topo_agent_mcp.app:main"
topo-mcp-export = "topo_agent_mcp.export:main"
topo-mcp-sync-leaderboard = "topo_agent_mcp.sync_leaderboard:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["topo_agent_mcp"]
